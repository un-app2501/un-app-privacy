<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>un-app Founder Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        .header h1 {
            color: #CDFF00;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header p {
            color: #888;
            font-size: 14px;
        }
        .refresh-btn {
            background: #CDFF00;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
        }
        .refresh-btn:hover { opacity: 0.8; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #CDFF00;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .section {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section h2 {
            color: #CDFF00;
            font-size: 16px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .event-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .event-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #222;
            font-size: 14px;
        }
        .event-row:last-child { border-bottom: none; }
        .event-type { color: #CDFF00; }
        .event-data { color: #888; }
        .event-time { color: #555; font-size: 12px; }
        
        .breakdown-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }
        .breakdown-bar {
            flex: 1;
            height: 8px;
            background: #222;
            border-radius: 4px;
            margin: 0 15px;
            overflow: hidden;
        }
        .breakdown-fill {
            height: 100%;
            background: #CDFF00;
            border-radius: 4px;
        }
        .breakdown-label { color: #888; min-width: 100px; }
        .breakdown-count { color: #CDFF00; min-width: 50px; text-align: right; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .platform-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .platform-ios { background: #CDFF00; color: #000; }
        .platform-web { background: #0088ff; color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 un-app Founder Dashboard</h1>
        <p>Real-time analytics (anonymous data only)</p>
        <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
        <p style="margin-top: 10px; color: #555;" id="lastUpdate"></p>
    </div>
    
    <div class="stats-grid" id="statsGrid">
        <div class="loading">Loading...</div>
    </div>
    
    <div class="section">
        <h2>📱 Query Breakdown</h2>
        <div id="queryBreakdown">
            <div class="loading">Loading...</div>
        </div>
    </div>
    
    <div class="section">
        <h2>🔗 Services Connected</h2>
        <div id="servicesBreakdown">
            <div class="loading">Loading...</div>
        </div>
    </div>
    
    <div class="section">
        <h2>📋 Recent Events (iOS App)</h2>
        <div class="event-list" id="recentEvents">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gklanhnlzxzfbbawomnd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrbGFuaG5senh6ZmJiYXdvbW5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwOTc0MjgsImV4cCI6MjA4NTY3MzQyOH0.XgB6Riy3iCrcLWTt9Wi2IF0m6a6yH9NjMgjRdf-x8Hk';
        
        async function fetchData(query) {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/analytics_events?${query}`, {
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                }
            });
            return response.json();
        }
        
        async function loadData() {
            document.getElementById('lastUpdate').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
            
            // Fetch all events
            const allEvents = await fetchData('select=*&order=id.desc&limit=1000');
            
            // Filter by platform
            const iosEvents = allEvents.filter(e => e.user_agent === 'un-app iOS');
            const webEvents = allEvents.filter(e => e.user_agent !== 'un-app iOS');
            
            // Calculate stats
            const iosUsers = new Set(iosEvents.map(e => e.session_id)).size;
            const webUsers = new Set(webEvents.map(e => e.session_id)).size;
            const totalUsers = new Set(allEvents.map(e => e.session_id)).size;
            
            const iosAppOpens = iosEvents.filter(e => e.event_type === 'app_started').length;
            const iosQueries = iosEvents.filter(e => e.event_type === 'query_submitted').length;
            const iosConnections = iosEvents.filter(e => e.event_type === 'service_connected').length;
            
            // Today's stats
            const today = new Date().toDateString();
            const todayEvents = iosEvents.filter(e => new Date(e.created_at).toDateString() === today);
            const todayUsers = new Set(todayEvents.map(e => e.session_id)).size;
            
            // Render stats
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${iosUsers}</div>
                    <div class="stat-label">iOS Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${iosAppOpens}</div>
                    <div class="stat-label">App Opens</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${iosQueries}</div>
                    <div class="stat-label">Queries</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${iosConnections}</div>
                    <div class="stat-label">Connections</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${todayUsers}</div>
                    <div class="stat-label">Today Active</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${webUsers}</div>
                    <div class="stat-label">Web Users</div>
                </div>
            `;
            
            // Query breakdown
            const queryEvents = iosEvents.filter(e => e.event_type === 'query_submitted');
            const queryCounts = {};
            queryEvents.forEach(e => {
                const q = e.event_data?.query || 'unknown';
                // Categorize
                let category = 'other';
                if (/sensex|nifty|stock|market|share/i.test(q)) category = 'stocks';
                else if (/hungry|food|swiggy|zomato|eat|order|pizza|biryani/i.test(q)) category = 'food';
                else if (/meeting|calendar|schedule|event/i.test(q)) category = 'calendar';
                
                queryCounts[category] = (queryCounts[category] || 0) + 1;
            });
            
            const totalQueries = Object.values(queryCounts).reduce((a, b) => a + b, 0) || 1;
            document.getElementById('queryBreakdown').innerHTML = Object.entries(queryCounts)
                .sort((a, b) => b[1] - a[1])
                .map(([cat, count]) => `
                    <div class="breakdown-row">
                        <span class="breakdown-label">${cat}</span>
                        <div class="breakdown-bar">
                            <div class="breakdown-fill" style="width: ${(count/totalQueries)*100}%"></div>
                        </div>
                        <span class="breakdown-count">${count}</span>
                    </div>
                `).join('') || '<p style="color:#888">No queries yet</p>';
            
            // Services breakdown
            const serviceEvents = iosEvents.filter(e => e.event_type === 'service_connected');
            const serviceCounts = {};
            serviceEvents.forEach(e => {
                const s = e.event_data?.service || 'unknown';
                serviceCounts[s] = (serviceCounts[s] || 0) + 1;
            });
            
            const totalServices = Object.values(serviceCounts).reduce((a, b) => a + b, 0) || 1;
            document.getElementById('servicesBreakdown').innerHTML = Object.entries(serviceCounts)
                .sort((a, b) => b[1] - a[1])
                .map(([svc, count]) => `
                    <div class="breakdown-row">
                        <span class="breakdown-label">${svc}</span>
                        <div class="breakdown-bar">
                            <div class="breakdown-fill" style="width: ${(count/totalServices)*100}%"></div>
                        </div>
                        <span class="breakdown-count">${count}</span>
                    </div>
                `).join('') || '<p style="color:#888">No connections yet</p>';
            
            // Recent events
            const recentIOS = iosEvents.slice(0, 20);
            document.getElementById('recentEvents').innerHTML = recentIOS.map(e => {
                const time = new Date(e.created_at).toLocaleString();
                const data = e.event_data ? JSON.stringify(e.event_data).substring(0, 40) : '';
                return `
                    <div class="event-row">
                        <span class="event-type">${e.event_type}</span>
                        <span class="event-data">${data}</span>
                        <span class="event-time">${time}</span>
                    </div>
                `;
            }).join('') || '<p style="color:#888">No events yet</p>';
        }
        
        // Load on page load
        loadData();
        
        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
